version: "3.9"

services:
  web:
    build: .
    container_name: vitochka_web
    command: gunicorn vitochka.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: vitochka_db
    environment:
      POSTGRES_DB: vitochka
      POSTGRES_USER: vitochka_user
      POSTGRES_PASSWORD: vitochka_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: