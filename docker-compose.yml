version: "3.9"

services:
  web:
    build: .
    container_name: vitochka_web
    command:  sh -c "
              python manage.py migrate &&
              python manage.py collectstatic --noinput &&
              gunicorn vitochka.wsgi:application --bind 0.0.0.0:8000
              "
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: always
    environment:
      DJANGO_SETTINGS_MODULE: vitochka.settings.prod

  db:
    image: postgres:16
    container_name: vitochka_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  nginx:
    image: nginx:alpine
    container_name: vitochka_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    restart: always

volumes:
  static_volume:
  media_volume:
  postgres_data: